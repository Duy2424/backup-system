{% extends "base.html" %}
{% block title %}Dang nhap - Backup System{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 6vh;">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div style="font-size: 2.4rem; color:#1e3a5f;"><i class="bi bi-hdd-network"></i></div>
      <h4 class="mt-2" style="color:#1e3a5f;">Backup System</h4>
      <div class="text-muted small">Giai phap backup cho doanh nghiep</div>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control"
                     autofocus required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn-backup w-100">
            <i class="bi bi-box-arrow-in-right"></i> Dang nhap
          </button>
        </form>
      </div>
    </div>
    <div class="text-center text-muted small mt-3">
      Tai khoan demo: <code>admin / admin123</code> &middot; <code>user1 / user123</code>
    </div>
  </div>
</div>
{% endblock %}
